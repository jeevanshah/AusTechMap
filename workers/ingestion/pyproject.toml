[project]
name = "austechmap-ingestion"
version = "0.1.0"
description = "Independent ingestion worker for Australia Tech Map"
requires-python = ">=3.12"
dependencies = [
    "boto3==1.43.88",
    "duckdb==1.5.5",
    "psycopg[binary]==3.3.5",
    "pyogrio==0.13.0",
    "sentry-sdk==2.68.1",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -p no:cacheprovider"
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requires a live PostgreSQL database with PostGIS"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "pyogrio.*"
ignore_missing_imports = true

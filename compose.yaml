name: austechmap

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: austechmap
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d austechmap"]
      interval: 2s
      timeout: 5s
      retries: 15
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - austechmap-postgres:/var/lib/postgresql/data

volumes:
  austechmap-postgres:

name: Verify R2 storage

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    name: Immutable R2 write/read/checksum probe
    runs-on: ubuntu-latest
    environment: production
    env:
      PYTHONPATH: workers/ingestion/src
      RAW_SNAPSHOT_BACKEND: r2
      RAW_SNAPSHOT_BUCKET: ${{ secrets.RAW_SNAPSHOT_BUCKET }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: workers/ingestion/requirements-dev.lock
      - run: python -m pip install -r workers/ingestion/requirements-dev.lock
      - run: python workers/ingestion/scripts/verify_r2_storage.py
